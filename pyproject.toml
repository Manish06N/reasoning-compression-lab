[project]
name = "reasoning-compression-lab"
version = "0.1.0"
description = "Deployment-science evaluation harness for compressed reasoning LLMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.11",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.0",
  "ruff>=0.4",
  "scikit-learn>=1.5",
  "math-verify==0.9.0",
]
hpc = [
  "torch==2.6.0",
  "transformers==5.12.1",
  "accelerate==1.14.0",
  "datasets==5.0.0",
  "huggingface_hub==1.21.0",
  "vllm==0.8.5",
  "math-verify==0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
