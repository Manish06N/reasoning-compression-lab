# Reproduction decoding protocol from Quantized-Reasoning-Models (inference.py defaults).
# Used for Level A reproduction before pilot grid changes.

temperature: 0.6
top_p: 0.95
max_tokens: 131072
max_model_len: 131072
repetition_penalty: 1.05
seed: 0
# Native 128k context for R1 distilled models. MATH-500 prompts are short; budget is for long CoT output.
# BF16 cells use default bf16 KV; quantized cells set fp8_e5m2 in model config.
notes: Native 128k max_tokens/max_model_len for DeepSeek-R1-Distill (Qwen-7B + Llama-8B). No 1M override.
