# Reproduction decoding protocol from Quantized-Reasoning-Models (inference.py defaults).
# Used for Level A reproduction before pilot grid changes.

temperature: 0.6
top_p: 0.95
max_tokens: 32768
max_model_len: 40960
repetition_penalty: 1.05
seed: 0
# QRM reproduction protocol (inference.py): max_new_tokens=32768. max_model_len headroom for prompt + generation.
notes: Level A QRM repro — must match QRM_REPRO_REFERENCE in sampling_utils.py and test_config_and_tasks.
