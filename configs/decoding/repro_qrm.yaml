# Reproduction decoding protocol from Quantized-Reasoning-Models (inference.py defaults).
# Used for Level A reproduction before pilot grid changes.

temperature: 0.6
top_p: 0.95
max_tokens: 1048576
max_model_len: 1048576
repetition_penalty: 1.05
seed: 0
# R1 distilled reasoning models often produce very long CoT traces (10k-50k+ tokens) before \boxed{}.
# Fixed high value (1M+) for long CoT on reasoning models. MATH-500 prompts are short; output can be very long.
# KV cache kept cheap via fp8 + GQA. No dynamic calc – simple fixed high max for the model.
notes: Fixed high max_tokens/max_model_len (1048576) for full reasoning traces on DeepSeek-R1-Distill (Qwen-7B + Llama-8B). Simplified, no over-engineering. Use with fp8 kv on quants.
