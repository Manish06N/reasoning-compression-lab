# Literature / baseline targets for reproduction sanity checks.
#
# Source map (QRM = Quantized Reasoning Models, COLM 2025):
#   - Table 1: Qwen-7B only (caption states Qwen-only).
#   - Appendix B, Table 4: Llama-8B baselines (avg ± std, temp 0.6, seeds 42–44).
#   - DeepSeek-R1 technical report: secondary cross-check (single-number refs).
#
# Compare: scripts/compare_qrm_baseline.py --summary results/<cell>_summary.json
#
# Tolerance policy:
#   pass_at_1 within ±tolerance_pp ABSOLUTE percentage points of reference (not relative %).
#   Default tolerance_pp: 5.0 (MATH-500, GSM8K — large n, high p).
#   GPQA-Diamond: tolerance_pp 8.0 (n=198, p≈0.5, binomial SE ≈ 3.5pp at single seed).
#
# Gate types:
#   hard   — Level A reproduction profile; failure blocks pipeline (b01 MATH-500).
#   sanity — informational band only; never exit 1 on pass@1 alone (GPQA uses sober profile).
#
# Benchmark scale cheat sheet:
#   MATH-500 / GSM8K (R1-distill BF16): ~85–95%
#   GPQA-Diamond (BF16):                ~45–55%  (NOT MATH-500 scale)
#   AIME-120:                             ~40–65%  (do NOT use for MATH-500 gates)

protocols:
  qrm_repro:
    temperature: 0.6
    top_p: 0.95
    max_tokens: 32768
    seeds: [42, 43, 44]
  our_hpc_repro:
    decoding_config: configs/decoding/repro_qrm.yaml
    seed: 0
    repetition_penalty: 1.05
  our_hpc_sober:
    note: "Level B/C main grid (GPQA b07) — do not hard-compare pass@1 to QRM repro numbers"

tolerance:
  pass_at_1_absolute_pp_default: 5.0
  gpqa_absolute_pp: 8.0
  note: "± absolute pp from reference; GPQA wider due to n=198 binomial variance"

models:
  DeepSeek-R1-Distill-Qwen-7B:
    MATH-500:
      quant_config: bf16
      gate: hard
      prompt_profile: reproduction
      pass_at_1_pct:
        reference: 94.0
        reference_std: 0.8
        reference_deepseek_report: 92.8
        source: "QRM Table 1 (Qwen-only; MATH-500 avg ± std, temp 0.6)"
        source_secondary: "DeepSeek-R1 report 92.8"
        tolerance_pp: 5.0
      completion_tokens_mean:
        sanity_min: 1000
        note: "Low mean suggests truncation/template bug even if pass@1 looks OK"
      truncation_rate_max: 0.15
      parse_failure_rate_max: 0.10
    GSM8K:
      quant_config: bf16
      gate: hard
      prompt_profile: reproduction
      pass_at_1_pct:
        reference: 91.0
        reference_std: 0.5
        source: "QRM Table 1 (Qwen-only; GSM8K avg ± std, temp 0.6)"
        tolerance_pp: 5.0
      truncation_rate_max: 0.10
      parse_failure_rate_max: 0.10
    GPQA-Diamond:
      quant_config: bf16
      gate: sanity
      prompt_profile: sober
      prompt_profile_note: "b07 cell uses sober profile — not comparable to QRM repro as hard gate"
      pass_at_1_pct:
        reference: 51.0
        reference_std: 1.0
        reference_deepseek_report: 49.1
        source: "QRM Table 1 (Qwen-only; GPQA-Diamond avg ± std, temp 0.6)"
        source_secondary: "DeepSeek-R1 report 49.1"
        tolerance_pp: 8.0
      truncation_rate_max: 0.20
      parse_failure_rate_max: 0.15

  DeepSeek-R1-Distill-Llama-8B:
    MATH-500:
      quant_config: bf16
      gate: hard
      prompt_profile: reproduction
      pass_at_1_pct:
        reference: 91.0
        reference_std: 1.1
        reference_deepseek_report: 89.1
        source: "QRM Appendix B Table 4 (Llama-8B; MATH-500 avg ± std, temp 0.6)"
        source_secondary: "DeepSeek-R1 report 89.1"
        tolerance_pp: 5.0
      completion_tokens_mean:
        sanity_min: 1000
      truncation_rate_max: 0.15
      parse_failure_rate_max: 0.10
    GSM8K:
      status: unused
      note: "No Llama-8B GSM8K cell wired in b01–b09 (b06 is Qwen-only); kept for reference"
      quant_config: bf16
      gate: sanity
      pass_at_1_pct:
        reference: 88.7
        reference_std: 0.4
        source: "QRM Appendix B Table 4 (Llama-8B; GSM8K avg ± std, temp 0.6)"
        tolerance_pp: 5.0
      truncation_rate_max: 0.10
      parse_failure_rate_max: 0.10
    GPQA-Diamond:
      quant_config: bf16
      gate: sanity
      prompt_profile: sober
      pass_at_1_pct:
        reference: 49.5
        reference_std: 2.3
        reference_deepseek_report: 49.0
        source: "QRM Appendix B Table 4 (Llama-8B; GPQA-Diamond avg ± std, temp 0.6)"
        source_secondary: "DeepSeek-R1 report 49.0"
        tolerance_pp: 8.0
      truncation_rate_max: 0.20
      parse_failure_rate_max: 0.15

  DeepSeek-R1-Distill-Qwen-1.5B:
    MATH-500:
      quant_config: bf16
      gate: sanity
      prompt_profile: reproduction
      pass_at_1_pct:
        reference: 84.7
        source: "QRM Table 1 (Qwen-only; 1.5B MATH-500 row)"
        tolerance_pp: 5.0
      truncation_rate_max: 0.15
      parse_failure_rate_max: 0.10
    GSM8K:
      quant_config: bf16
      gate: sanity
      pass_at_1_pct:
        reference: 84.5
        source: "QRM Table 1 (Qwen-only; 1.5B GSM8K row)"
        tolerance_pp: 5.0
      truncation_rate_max: 0.10
      parse_failure_rate_max: 0.10

  DeepSeek-R1-Distill-Qwen-7B-GPTQ-W4G128:
    MATH-500:
      quant_config: gptq4
      gate: hard
      prompt_profile: reproduction
      pass_at_1_pct:
        reference: null
        source: "QRM Table 1 GPTQ W4G128 MATH-500 — fill exact ref from paper"
        tolerance_pp: 5.0
      truncation_rate_max: 0.15
      parse_failure_rate_max: 0.10

sober_reasoning_reference:
  DeepSeek-R1-Distill-Qwen-7B:
    math500_pct: 94.1
    note: "sober-reasoning leaderboard; temp=0.8 — NOT a pass/fail gate"
