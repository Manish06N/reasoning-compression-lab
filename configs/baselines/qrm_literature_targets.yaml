# Literature / baseline targets for reproduction sanity checks.
# Primary anchor: QRM (Quantized Reasoning Models, COLM 2025) Table 1.
# Secondary cross-check: DeepSeek-R1 technical report (single-number refs).
# sober-reasoning leaderboard: different protocol — reference only, not pass/fail.
#
# Compare: scripts/compare_qrm_baseline.py --summary results/<cell>_summary.json
#
# Tolerance policy (J1 reproduction gate):
#   pass@1 passes when observed is within ±5 ABSOLUTE percentage points of reference
#   (e.g. reference 92.8 → acceptable 87.8–97.8). NOT relative ±5%.
#
# Benchmark scale cheat sheet (prevents cross-task copy errors):
#   MATH-500 (R1-distill BF16):  ~85–95%  — high
#   GSM8K (R1-distill BF16):     ~85–92%  — high
#   GPQA-Diamond (BF16):         ~45–55%  — mid (NOT MATH-500 scale)
#   AIME-120:                    ~40–65%  — hard; do NOT use for MATH-500 gates
#
# Protocol deltas vs QRM Table 1:
#   - QRM: seeds 42–44 averaged; b01 anchors use seed 0 (expect ~1–2 pp noise).
#   - repro_qrm.yaml adds repetition_penalty=1.05 (vLLM anti-loop; not in QRM code).

protocols:
  qrm_repro:
    temperature: 0.6
    top_p: 0.95
    max_tokens: 32768
    seeds: [42, 43, 44]
  our_hpc_repro:
    decoding_config: configs/decoding/repro_qrm.yaml
    seed: 0
    repetition_penalty: 1.05

tolerance:
  pass_at_1_absolute_pp: 5.0
  note: "±5 absolute percentage points from reference (not relative %)"

models:
  DeepSeek-R1-Distill-Qwen-7B:
    MATH-500:
      quant_config: bf16
      pass_at_1_pct:
        reference: 92.8
        reference_qrm_table1_approx: 94.0
        source: "DeepSeek-R1 report Table; QRM Table 1 multi-seed avg ~94 (both inside band)"
        sanity_min: 87.8
        sanity_max: 97.8
      completion_tokens_mean:
        sanity_min: 1000
        note: "Low mean suggests truncation/template bug even if pass@1 looks OK"
      truncation_rate_max: 0.15
      parse_failure_rate_max: 0.10
    GSM8K:
      quant_config: bf16
      pass_at_1_pct:
        reference: 91.0
        source: "QRM Table 1 GSM8K row (BF16 / full-precision anchor)"
        sanity_min: 86.0
        sanity_max: 96.0
      truncation_rate_max: 0.10
      parse_failure_rate_max: 0.10
    GPQA-Diamond:
      quant_config: bf16
      pass_at_1_pct:
        reference: 49.1
        source: "QRM Table 1 GPQA-Diamond row"
        sanity_min: 44.1
        sanity_max: 54.1
      truncation_rate_max: 0.20
      parse_failure_rate_max: 0.15

  DeepSeek-R1-Distill-Llama-8B:
