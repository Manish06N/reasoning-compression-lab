name: CI

on:
  push:
    branches: [main, paper-major-revision, paper-p0-reanalysis, paper-serving-confirmation]
  pull_request:
    branches: [main, paper-major-revision]

jobs:
  canonical-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Recompute canonical report and fail on drift
        run: python scripts/analysis/revision_reanalysis.py --check
      - name: Recompute serving confirmation report and fail on drift
        run: python scripts/analysis/measured_serving_confirmation_analysis.py --check
      - name: Compare generated tables with frozen markdown
        run: python scripts/analysis/emit_major_revision_tables.py --check
      - name: Modal compact artifact check
        run: python scripts/analysis/modal_agreement_analysis.py --check-artifact
      - name: Confirmation raw artifact presence
        run: python scripts/hpc/qrm_parity/benchmark_serving_confirmation.py --check
      - name: Item-level descriptive analysis
        run: python scripts/analysis/item_level_descriptive_analysis.py --check
      - name: Validate runtime manifest
        run: python scripts/analysis/validate_runtime_manifest.py --check
      - name: Manuscript TeX tables vs frozen numbers
        run: python scripts/check_tex_tables.py --check
      - name: Manuscript frozen-number needles
        run: python scripts/analysis/check_manuscript_numbers.py --check
      - name: Required frozen artifacts exist
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              "results/reports/revision_reanalysis_report.json",
              "results/reports/major_revision_tables.md",
              "results/reports/major_revision_validation.md",
              "results/reports/modal_agreement_report.json",
              "results/recovered/math500_modal_inputs.jsonl",
              "results/reports/measured_serving_confirmation/measured_serving_confirmation_report.json",
              "results/reports/runtime_manifest.json",
              "results/reports/item_level_descriptive_report.json",
              "paper/main.tex",
              "paper/references.bib",
              "REPRODUCE.md",
              "FINAL_PUBLICATION_AUDIT.md",
              "SUBMISSION_REVIEW.md",
              "configs/publication/INDEX.json",
              "docs/VENUE.md",
          ]
          missing = [p for p in required if not Path(p).is_file()]
          if missing:
              raise SystemExit("missing files:\n" + "\n".join(missing))
          print(f"OK: {len(required)} required artifacts present")
          PY

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Python compile check
        run: python -m compileall -q src scripts tests

      - name: Shell syntax check
        run: |
          for f in scripts/hpc/*.sh scripts/macbook/*.sh scripts/local/*.sh slurm/*.sh; do
            [ -f "$f" ] && bash -n "$f"
          done

      - name: Block deprecated src.metrics.scoring imports
        run: |
          if rg 'from src\.metrics\.scoring' scripts/ tests/ 2>/dev/null; then
            echo "Use src.evaluation.correctness.scoring instead of src.metrics.scoring"
            exit 1
          fi

      - name: Verify decoding params
        run: python scripts/verify_decoding_params.py

      - name: Validate cell matrix
        run: python scripts/validate_cell_matrix.py

      - name: Publication preflight (CI subset)
        run: python scripts/hpc/07_preflight_publication.py --ci

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Ruff check (publication Python)
        run: ruff check src tests scripts/analysis/revision_reanalysis.py scripts/analysis/emit_major_revision_tables.py scripts/analysis/item_level_descriptive_analysis.py scripts/analysis/validate_runtime_manifest.py scripts/analysis/check_manuscript_numbers.py scripts/check_tex_tables.py scripts/pin_hf_revisions.py

      - name: Verify revision pins
        run: python scripts/pin_hf_revisions.py --verify
